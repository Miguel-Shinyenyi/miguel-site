name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  repository_dispatch:
    types: [umwayi-content]
  workflow_dispatch: {}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Explicit step rather than relying solely on withastro/action@v3
      # (or npm's own prebuild lifecycle hook inside it) to invoke this:
      # this repo has no way to check that action's internals against the
      # live network from here, so the content sync runs as its own step
      # regardless of what build command the action ends up calling.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # PRIVATE_NAMES drives sync-content.mjs's privacy check (the names
      # live only in this secret, never in the repo). It's set on both
      # steps because the action's own build re-runs the sync through
      # npm's prebuild hook, and the check has to be armed for that run
      # too, not just the explicit one above.
      - name: Sync content from UMWAYI
        run: node scripts/sync-content.mjs
        env:
          PRIVATE_NAMES: ${{ secrets.PRIVATE_NAMES }}
      - uses: withastro/action@v3
        env:
          PRIVATE_NAMES: ${{ secrets.PRIVATE_NAMES }}
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
